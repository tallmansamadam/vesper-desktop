[package]
name = "vesper"
version = "1.0.0"
edition = "2021"
description = "Vesper - native multi-vendor smart light controller"

[dependencies]
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = "0.19"
ureq = { version = "2.10", features = ["json", "native-tls"] }
native-tls = "0.2"
serde_json = "1"
if-addrs = "0.13"
socket2 = "0.5"
fastrand = "2"
tray-icon = "0.19"
global-hotkey = "0.6"
cpal = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
